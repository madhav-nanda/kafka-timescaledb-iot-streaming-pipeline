##############################################################################
# Wind Turbine Streaming Platform — Prometheus Configuration
##############################################################################

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files: []

scrape_configs:

  # ── Prometheus self-monitoring ──────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── Kafka metrics (via danielqsj/kafka-exporter) ───────────────────────
  # Exports consumer group lag, topic/partition offsets, broker metadata
  - job_name: "kafka"
    static_configs:
      - targets: ["kafka-exporter:9308"]
    scrape_interval: 15s

  # ── MinIO cluster metrics ──────────────────────────────────────────────
  # Requires MINIO_PROMETHEUS_AUTH_TYPE=public on the MinIO container
  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  # ── MinIO bucket-level metrics ─────────────────────────────────────────
  - job_name: "minio-bucket"
    metrics_path: /minio/v2/metrics/bucket
    static_configs:
      - targets: ["minio:9000"]

  # ── TimescaleDB / PostgreSQL exporter ──────────────────────────────────
  - job_name: "timescaledb"
    static_configs:
      - targets: ["timescaledb-exporter:9187"]

  # ── Wind Turbine Pipeline exporter (custom Python) ─────────────────────
  # Simulator + producer metrics: events_produced, delivery_failures, etc.
  - job_name: "windturbine_pipeline"
    static_configs:
      - targets: ["pipeline-exporter:8000"]
    scrape_interval: 10s
