version: 1
disable_existing_loggers: false

formatters:
  json:
    class: pythonjsonlogger.jsonlogger.JsonFormatter
    format: "%(asctime)s %(name)s %(levelname)s %(message)s"
    datefmt: "%Y-%m-%dT%H:%M:%S%z"
  console:
    format: "%(asctime)s [%(levelname)-8s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: console
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: /var/log/windturbine/pipeline.log
    maxBytes: 10485760  # 10 MB
    backupCount: 5
    encoding: utf-8

loggers:
  simulator:
    level: INFO
    handlers: [console]
    propagate: false
  producer:
    level: INFO
    handlers: [console]
    propagate: false
  spark_pipeline:
    level: INFO
    handlers: [console]
    propagate: false

root:
  level: INFO
  handlers: [console]
